name: Docker Image CI (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Install doctl
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Connect to DigitalOcean Kubernetes
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: doctl kubernetes cluster kubeconfig save flashcards-k8s

    - name: Update image in Kubernetes
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        kubectl set image deployment/backend-service \
          backend-service=ghcr.io/tetramousse/flashcardsmonorepo-api:sha-$(echo ${{ github.sha }} | cut -c1-7)
