services:
  backend-service:
    build: .
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MARKITDOWN_URL=http://markitdown:8490/process_file
      - UNSTRUCTURED_URL=http://unstructured:8000/general/v0/general
      - FLASHCARD_GEN_URL=http://flashcard-gen:8000/generate
      - FIREBASE_CREDENTIALS_PATH=/app/serviceAccountKey.json
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    depends_on:
      - db
      - markitdown
      - unstructured
      - flashcard-gen
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  unstructured:
    image: robwilkes/unstructured-api:latest
    restart: unless-stopped

  markitdown:
    build:
      context: ../MarkItDownServer
      dockerfile: Dockerfile
    restart: unless-stopped

  flashcard-gen:
    build:
      context: ../FlashcardGenerator
      dockerfile: Dockerfile
    environment:
      - API_KEY=${AI_API_KEY}
      - MODEL=${AI_MODEL}
      - BASE_URL=${AI_BASE_URL}
    restart: unless-stopped

volumes:
  postgres_data:
